# Publish dsh-cnblogs to npm through a trusted publisher (OIDC) — no token stored.
#
# The first publish of a new package cannot use this workflow: npm cannot
# configure a trusted publisher for a package that does not exist yet, and a
# non-TTY shell cannot clear the 2FA challenge. Publish 0.1.0 by hand once
# (`npm publish --access public` in a real terminal), then open
# https://www.npmjs.com/package/dsh-cnblogs/access and add the trusted publisher:
#
#   Organization or user: Niobium-41-nb
#   Repository:           dsh-cnblogs
#   Workflow filename:    publish.yml     (byte-for-byte, with the extension)
#   Allowed actions:      ☑ npm publish   (configurations created after 2026-09-03
#                                          default to `npm stage publish` only)
#
# Both fields fail silently when wrong: npm saves them without validating, and the
# mistake only shows up as ENEEDAUTH/EOTP on the publish that needs them.
#
# After that, every release is: bump `version`, push a `v*` tag (or run this
# workflow manually) — the workflow installs, builds, checks whether the version
# is already on the registry, and publishes only when it is not.
name: publish

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # required: this is what lets npm verify the workflow

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      # Node 24 on purpose: trusted publishing needs the npm CLI at 11.5.1+ and
      # Node 22 still ships npm 10.x. The package's engines field allows 24.
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false # never cache in a release build

      - name: Install
        run: pnpm install --frozen-lockfile

      # `lib/` is gitignored, so the tarball needs this build. Order matters:
      # tsdown consumes the declarations that `tsc -b` emits into lib/types.
      - name: Build
        run: |
          node node_modules/typescript/bin/tsc -b tsconfig.json
          node node_modules/tsdown/dist/run.mjs

      - name: Resolve the version to publish
        id: target
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      # A published version can never be overwritten, so re-running this workflow
      # (e.g. a tag pushed twice) must be a no-op rather than a red build.
      - name: Already published
        if: steps.target.outputs.already == 'true'
        run: echo "${{ steps.target.outputs.name }}@${{ steps.target.outputs.version }} is already on the registry."

      - name: Publish
        if: steps.target.outputs.already == 'false'
        run: npm publish --access public
